<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle">Utrecht in beweging – een kaartverhaal over verkeersprojecten</title>

  <meta name="theme-color" content="#0f4c5c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f4c5c'/%3E%3Ccircle cx='9' cy='21' r='5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='21' r='5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#map" data-i18n="exploreMap">Verken de kaart</a>

  <header class="site-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="6" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 16l4-8h5l3 8M10 8L8.5 5.5H7M13 12h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <p class="brand-title" data-i18n="siteTitle">Utrecht in beweging</p>
        <p class="brand-subtitle" data-i18n="siteSubtitle">Verkeersprojecten voor een aantrekkelijke en bereikbare stad</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Taalkeuze" data-i18n-aria="a11y.languageSwitcher">

        <span class="lang-sep" aria-hidden="true">|</span>
        <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false" aria-label="English" data-i18n-aria="a11y.switchToEn">EN</button>
      </div>
      <a class="github-link" href="https://github.com/bertt/utrecht-cycling-mapstory" target="_blank" rel="noopener noreferrer" aria-label="Bekijk de broncode op GitHub (opent in een nieuw tabblad)" data-i18n-aria="a11y.github">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span data-i18n="github">GitHub</span>
      </a>
    </div>
  </header>

  <main class="layout">
    <aside id="story" class="story-panel" aria-label="Verhaal" data-i18n-aria="a11y.storyPanel">
      <article id="chapter" class="chapter" tabindex="-1"></article>

      <footer class="panel-footer">
        <p data-i18n="footer.text"></p>
        <p data-i18n="footer.attribution"></p>
      </footer>
    </aside>

    <section class="map-wrap">
      <div id="map" role="region" aria-label="Interactieve kaart van fietsprojecten in Utrecht" data-i18n-aria="a11y.map"></div>
      <p id="map-error" class="map-error" role="alert" hidden></p>

      <div id="legend" class="legend" data-collapsed="false">
        <button type="button" id="legend-toggle" class="legend-toggle" aria-expanded="true" aria-controls="legend-body">
          <span data-i18n="legendTitle">Legenda</span>
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul id="legend-body" class="legend-list"></ul>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/app.js"></script>

</html>
